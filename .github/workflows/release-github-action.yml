name: release-github-action

# Fork note (TKT-336): push trigger disabled. Release automation for the github/**
# subpath (github-action distribution), same safety reasoning as publish.yml -- this
# fork does not cut its own releases. workflow_dispatch added as a manual escape hatch.
on:
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write

jobs:
  release:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - run: git fetch --force --tags

      - name: Release
        run: |
          git config --global user.email "opencode@sst.dev"
          git config --global user.name "opencode"
          ./github/script/release
