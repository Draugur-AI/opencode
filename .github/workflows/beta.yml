name: beta

# Fork note (TKT-336): schedule trigger disabled. runs-on is blacksmith-4vcpu-ubuntu-2404,
# which queues forever on this org -- HOURLY cron made this the single largest
# contributor to the accumulated queued-run backlog (24/day since Actions enablement).
# Beta-channel sync is not meaningful on a fork that isn't publishing releases (see
# publish.yml). workflow_dispatch kept as a manual escape hatch.
on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Setup Git Committer
        id: setup-git-committer
        uses: ./.github/actions/setup-git-committer
        with:
          opencode-app-id: ${{ vars.OPENCODE_APP_ID }}
          opencode-app-secret: ${{ secrets.OPENCODE_APP_SECRET }}

      - name: Install OpenCode
        run: bun i -g opencode-ai

      - name: Sync beta branch
        env:
          GH_TOKEN: ${{ steps.setup-git-committer.outputs.token }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: bun script/beta.ts
