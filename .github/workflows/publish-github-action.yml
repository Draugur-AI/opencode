name: publish-github-action

# Fork note (TKT-336): tag-push trigger disabled. Real publish pipeline, same reasoning
# as publish.yml (safety, not just runner availability -- see there). This fork does not
# cut github-v* release tags; workflow_dispatch kept as a manual escape hatch.
on:
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write

jobs:
  publish:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0
        with:
          fetch-depth: 0

      - run: git fetch --force --tags

      - name: Publish
        run: |
          git config --global user.email "opencode@sst.dev"
          git config --global user.name "opencode"
          ./script/publish
        working-directory: ./github
