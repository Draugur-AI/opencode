name: opencode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  opencode:
    # Fork note (TKT-336): disabled -- same double-blocker as review.yml's /review
    # trigger (see FORK.md): runs-on is blacksmith-4vcpu-ubuntu-2404 (queues forever)
    # AND the step needs OPENCODE_API_KEY, not configured on this repo. Fires on any
    # PR/issue comment containing "/oc" or "/opencode", so left enabled it could add a
    # permanently-queued run at any time. `false &&` is a one-line, trivially revertible
    # off-switch that preserves the real condition beneath it. Un-disable condition:
    # both a GitHub-hosted runs-on AND an operator-provisioned OPENCODE_API_KEY secret.
    if: |
      false &&
      (contains(github.event.comment.body, ' /oc') ||
      startsWith(github.event.comment.body, '/oc') ||
      contains(github.event.comment.body, ' /opencode') ||
      startsWith(github.event.comment.body, '/opencode'))
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      id-token: write
      contents: read
      pull-requests: read
      issues: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: ./.github/actions/setup-bun

      - name: Run opencode
        uses: anomalyco/opencode/github@2c14fc5586fe0b88e5c04732d2e846769cc35671 # latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          OPENCODE_PERMISSION: '{"bash": "deny"}'
        with:
          model: opencode/claude-opus-4-5
