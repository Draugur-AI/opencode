name: test

on:
  push:
    branches:
      - dev
  pull_request:
  workflow_dispatch:

concurrency:
  # Keep every run on dev so cancelled checks do not pollute the default branch
  # commit history. PRs and other branches still share a group and cancel stale runs.
  group: ${{ case(github.ref == 'refs/heads/dev', format('{0}-{1}', github.workflow, github.run_id), format('{0}-{1}', github.workflow, github.event.pull_request.number || github.ref)) }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  unit:
    name: unit (${{ matrix.settings.name }})
    strategy:
      fail-fast: false
      matrix:
        settings:
          # Fork note (TKT-305, retargeting extended to the e2e job below in TKT-336):
          # blacksmith-* runner labels require the Blacksmith GitHub App, which is not
          # installed on Draugur-AI, so jobs targeting them queue forever on this fork.
          # Retargeted to GitHub-hosted runners. See FORK.md.
          - name: linux
            host: ubuntu-latest
          - name: windows
            host: windows-latest
    runs-on: ${{ matrix.settings.host }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Configure git identity
        run: |
          git config --global user.email "bot@opencode.ai"
          git config --global user.name "opencode"

      - name: Cache Turbo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: node_modules/.cache/turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('turbo.json', '**/package.json') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('turbo.json', '**/package.json') }}-
            turbo-${{ runner.os }}-

      - name: Run unit tests
        # Fork note (TKT-336): Linux-only. Windows unit was a "varying subset of
        # unrelated tests" red (FORK.md's old known-red table, mode A/B) that a
        # per-test timeout raise (packages/core's own missing --timeout, fixed
        # separately) only partly addressed -- it stabilized the genuinely-slow
        # suites (i18n parity, Git worktrees/trees, LocationServiceMap,
        # MoveSession) but exposed a real, deterministic failure underneath:
        # Ripgrep.Error: ripgrep execution failed on windows-latest, every run,
        # not a timing margin issue (confirmed: raising the timeout to 30s just
        # meant it failed at exactly 30000ms instead of ~5000ms -- a genuine
        # execution failure, not slowness). RipgrepBinary's Windows path
        # downloads+extracts a zip via PowerShell at first use; root-causing
        # that is real production-code investigation, out of scope for a CI
        # hygiene ticket. Per the ticket's own stated fallback ("skip the
        # windows unit job entirely... if timeouts alone do not stabilize it"),
        # skipped here rather than chased further. Un-skip condition: the
        # Ripgrep-on-Windows execution failure is root-caused and fixed
        # (tracked in the feedback queue, TKT-336's diary has the log excerpt).
        if: runner.os == 'Linux'
        timeout-minutes: 20
        run: GITHUB_ACTIONS=false bun turbo test
        env:
          OPENCODE_EXPERIMENTAL_DISABLE_FILEWATCHER: ${{ runner.os == 'Windows' && 'true' || 'false' }}

      - name: Check generated client
        if: runner.os == 'Linux'
        working-directory: packages/client
        run: bun run check:generated

      - name: Run HttpApi exerciser gates
        if: runner.os == 'Linux'
        working-directory: packages/opencode
        run: bun run test:httpapi

  e2e:
    name: e2e (${{ matrix.settings.name }})
    strategy:
      fail-fast: false
      matrix:
        settings:
          # Fork note (TKT-336): was blacksmith-*, queued forever (no Blacksmith app on
          # this org) and held its whole workflow run open, blocking rerun-failed-jobs for
          # every job in the run, e2e included. Retargeted to GitHub-hosted. See FORK.md.
          - name: linux
            host: ubuntu-latest
          - name: windows
            host: windows-latest
    runs-on: ${{ matrix.settings.host }}
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright-browsers
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # Playwright 1.59 hangs while extracting Chromium with Node 24.16.
          node-version: "24.15"

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Read Playwright version
        id: playwright-version
        run: |
          version=$(node -e 'console.log(require("./package.json").workspaces.catalog["@playwright/test"])')
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ github.workspace }}/.playwright-browsers
          key: ${{ runner.os }}-${{ runner.arch }}-playwright-${{ steps.playwright-version.outputs.version }}-chromium

      - name: Install Playwright system dependencies
        if: runner.os == 'Linux'
        working-directory: packages/app
        run: bunx playwright install-deps chromium

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: packages/app
        run: bunx playwright install chromium

      - name: Run app e2e tests
        # Fork note (TKT-336): runs on both platforms -- an earlier version of this
        # comment skipped Windows on a mistaken "~40 systemic failures" reading (a grep
        # artifact counting Playwright's test-discovery listing, not actual failures;
        # corrected in feedback #156). The real picture: e2e was never run on EITHER
        # platform before this ticket (both queued forever on blacksmith), and now that
        # it runs, both show occasional single-spec flakiness -- ordinary E2E flake, not
        # a platform-specific gap. e2e is intentionally NOT part of this fork's merge
        # gate (see FORK.md, "The merge gate") -- stabilizing inherent Playwright
        # flakiness is a different body of work than CI hygiene, and it predates this
        # ticket. Kept running, symmetric across platforms, as an observational signal
        # with a deterministic reading rule (FORK.md): the SAME spec failing 3
        # consecutive runs is a real regression, worth filing; scattered single-spec
        # flakes across different specs are not.
        run: bun --cwd packages/app test:e2e:local
        env:
          CI: true
        timeout-minutes: 30

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-${{ matrix.settings.name }}-${{ github.run_attempt }}
          if-no-files-found: ignore
          retention-days: 7
          path: |
            packages/app/e2e/test-results
            packages/app/e2e/playwright-report
