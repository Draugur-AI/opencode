name: generate

# Fork note (TKT-336): auto-trigger disabled. runs-on is blacksmith-4vcpu-ubuntu-2404,
# which queues forever on this org and was accumulating unstartable runs on every push
# to dev. Also a deliberate safety choice, not just a runner fix: this job auto-commits
# and pushes generated output back to whatever branch triggered it, unreviewed -- this
# fork's own convention (FORK.md) is that generated code is regenerated and committed
# manually as part of a reviewed PR, never pushed unattended to dev. workflow_dispatch
# kept as a manual escape hatch. Un-disable condition: retarget runs-on AND restore the
# push trigger below, only if the unattended-push behavior is deliberately wanted here.
on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Setup git committer
        id: committer
        uses: ./.github/actions/setup-git-committer
        with:
          opencode-app-id: ${{ vars.OPENCODE_APP_ID }}
          opencode-app-secret: ${{ secrets.OPENCODE_APP_SECRET }}

      - name: Generate
        run: ./script/generate.ts

      - name: Commit and push
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes to commit"
            exit 0
          fi
          git add -A
          git commit -m "chore: generate" --allow-empty
          git push origin HEAD:${{ github.ref_name }} --no-verify
          # if ! git push origin HEAD:${{ github.event.pull_request.head.ref || github.ref_name }} --no-verify; then
